# Organization and project keys
sonar.organization=luckmenez
sonar.projectKey=Luckmenez_11soat-node-orders

# Project metadata
sonar.projectName=11soat-node-orders
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=test,src/**/__tests__
sonar.sourceEncoding=UTF-8

# TypeScript/JavaScript specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.spec.ts,**/*.test.ts,**/test/**,**/__tests__/**,**/*.module.ts,**/*.dto.ts,**/*.interface.ts,**/*.enum.ts,**/main.ts

# Test coverage exclusions
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.steps.ts,**/test/**,**/__tests__/**,**/*.module.ts,**/*.dto.ts,**/*.interface.ts,**/*.enum.ts,**/main.ts,**/prisma/**

# Test inclusions
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts

# Duplication exclusions (excluir testes da análise de duplicação)
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.e2e-spec.ts,**/*.steps.ts,**/test/**,**/__tests__/**

# Code analysis exclusions for tests
# Não analisar complexidade, code smells, etc. em arquivos de teste
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# Ignore all issues in test files
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.spec.ts

sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts

sonar.issue.ignore.multicriteria.e3.ruleKey=*
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.e2e-spec.ts

sonar.issue.ignore.multicriteria.e4.ruleKey=*
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.steps.ts

sonar.issue.ignore.multicriteria.e5.ruleKey=*
sonar.issue.ignore.multicriteria.e5.resourceKey=**/test/**/*

# SCM (Source Control Management)
sonar.scm.provider=git

# Additional settings
sonar.language=ts
